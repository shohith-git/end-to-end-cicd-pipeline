name: cicd pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      
permissions:
  id-token: write
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
        - name: checkout
          uses: actions/checkout@v4
          
        - name: set-up python
          uses: actions/setup-python@v5

        - name: install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: run application tests
          run: pytest

  docker:
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Set image version
        run: echo "IMAGE_VERSION=v${{ github.run_number }}" >> $GITHUB_ENV

      - name: docker image
        run: docker build -t end-to-end-cicd-pipeline:${{ env.IMAGE_VERSION }} .
        
      - name: security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'end-to-end-cicd-pipeline:${{ env.IMAGE_VERSION }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'
          

      - name: docker container
        run: docker run -d -p 5000:5000 --name ci-pipeline end-to-end-cicd-pipeline:${{ env.IMAGE_VERSION }}
    
      - name: health check
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-pipeline)
      
            if [ "$status" = "healthy" ]; then
              echo "Container is healthy"
              break
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Container is unhealthy"
              exit 1
            fi

            echo "Container is still starting..."
            sleep 2
          done

          if [ "$status" != "healthy" ]; then
            echo "Container did not become healthy"
            exit 1
          fi
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image
        run: |
          docker tag end-to-end-cicd-pipeline:${{ env.IMAGE_VERSION }} \
            ${{ steps.login-ecr.outputs.registry }}/end-to-end-cicd-pipeline:${{ env.IMAGE_VERSION }}

      - name: Push image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/end-to-end-cicd-pipeline:${{ env.IMAGE_VERSION }}